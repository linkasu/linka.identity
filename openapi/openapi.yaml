openapi: 3.1.0
info:
  title: LINKa Identity API
  version: 0.1.0
  description: >-
    API for optional accounts, anonymous installations, encrypted email
    identities, organizations, consent, telemetry preference, privacy requests,
    and product-scoped tokens. Workload credentials are role- and product-scoped.
    Root UUIDs never appear in a response or token. Raw email is returned only by
    the private product-scoped directory, never by public endpoints or in tokens.
    Public product accounts are local/unreleased; this is not deployment approval.
servers:
  - url: http://localhost:8080
security:
  - internalBearer: []
paths:
  /healthz:
    get:
      operationId: health
      summary: Report process liveness
      security: []
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
  /readyz:
    get:
      operationId: readiness
      summary: Report YDB and schema readiness
      security: []
      responses:
        "200":
          description: YDB is reachable and the current idempotent schema version is applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "503":
          $ref: "#/components/responses/Unavailable"
  /.well-known/jwks.json:
    get:
      operationId: getJWKS
      summary: Return active and retiring token verification keys
      security: []
      responses:
        "200":
          description: Active Ed25519 verification key
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      additionalProperties:
                        type: string
  /v1/installations:
    post:
      operationId: createInstallation
      summary: Create an anonymous product installation and return only its pairwise key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstallationRequest"
      responses:
        "201":
          description: Installation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Installation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/public/installations:
    post:
      operationId: registerPublicInstallation
      summary: Bootstrap an anonymous installation without a workload credential
      description: >-
        Native clients receive an audience-separated refresh capability and, when
        telemetry is allowed, a short-lived Metrics JWT. No device identifier or
        free-form metadata is accepted. Exact retries with the same request_id and
        body resolve to the same installation. Preference unknown bootstraps without
        consent, suppression or Metrics JWT; policy_version and recorded_at remain
        required. A new registration is required after denial.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicInstallationRequest"
      responses:
        "201":
          description: Anonymous installation registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicInstallationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    options: &publicInstallationPreflight
      summary: Public installation CORS preflight
      description: Exact allowed origins only; no Access-Control-Allow-Credentials or cookies.
      security: []
      responses:
        "204":
          description: Preflight accepted
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/public/installations/token:
    post:
      operationId: refreshPublicInstallationToken
      summary: Exchange an installation refresh capability for a short-lived Metrics JWT
      security:
        - refreshBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: Metrics JWT issued for an allowed installation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicTokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    options: *publicInstallationPreflight
  /v1/public/installations/telemetry-preference:
    put:
      operationId: denyPublicInstallationTelemetry
      summary: Durably deny telemetry for an anonymous installation
      description: >-
        Denial triggers the existing Metrics suppression outbox. Re-enabling the
        suppressed subject is forbidden; explicit later consent creates a new installation.
      security:
        - refreshBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicPreferenceRequest"
      responses:
        "200":
          description: Telemetry denied and suppression queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicPreferenceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    options: *publicInstallationPreflight
  /v1/public/email/challenges:
    post:
      operationId: beginPublicAccountChallenge
      summary: Begin product registration using an installation refresh JWT
      description: >-
        Strict non-null JSON object, at most 4096 bytes; no query parameters.
        Begin queues delivery for at most 48 hours without reserving provider daily
        quota. First status is queued. Exact request_id/body retries poll current
        status without charging again or resetting time/queue position; no GET route.
        Changed bindings return 409. Contact anti-abuse remains 6 per 15 minutes
        with a 60-second resend floor. Global requested/delivering queue capacity
        equals PUBLIC_ACCOUNT_DAILY_LIMIT (default 200); a full queue rejects new
        requests with 429 and Retry-After 60, not acceptance. Before SMTP claim,
        reserve rolling-24h attempts (default 200) and 1/s; these do not reserve
        quotas for other cloud SMTP users. Code validity begins at claim, not Begin:
        challenge and private verification atomically receive a 10-minute window.
        Only a definite negative SMTP 4xx with no acceptance defers the same queued
        job for 5 minutes, preserving encrypted code, CreatedAt and the 48-hour
        deadline; the next claim starts a new 10-minute window. mailAttempts is
        monotonic; no quota refunds. Network/EOF/uncertain outcomes never trigger
        automatic SMTP retry. Queue expiry is terminal and scrubs proofs/code.
        Acceptance does not prove delivery or account existence.
      security:
        - refreshBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicAccountChallengeRequest"
      responses:
        "202":
          description: Queued challenge or current status on exact Begin retry; not an ownership proof
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicAccountChallenge"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          description: rate_limited; full queue rejects new work with Retry-After 60; other anti-abuse limits may differ
          headers:
            Retry-After:
              description: Seconds until retry; 60 when queue capacity is full
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/AccountUnavailable"
    options: &publicAccountPreflight
      summary: Public account CORS preflight
      description: >-
        No query parameters. Exact origins from PUBLIC_INSTALLATION_ALLOWED_ORIGINS
        only; no Access-Control-Allow-Credentials, cookies or workload credentials.
      security: []
      responses:
        "204":
          description: Preflight accepted; Cache-Control no-store
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
              description: Echoed only for an allowed nonempty Origin
            Access-Control-Allow-Methods:
              schema:
                const: POST, PUT, OPTIONS
            Access-Control-Allow-Headers:
              schema:
                const: Authorization, Content-Type
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/public/email/challenges/{id}/verify:
    parameters:
      - $ref: "#/components/parameters/UUIDPath"
    post:
      operationId: verifyPublicAccountChallenge
      summary: Verify an OTP bound to the same product, installation and nonce
      description: >-
        Strict non-null JSON object, at most 4096 bytes; no query parameters.
        Rejected/expired/binding-mismatched challenges return 400 challenge_rejected;
        invalid syntax returns 400 invalid_request. No email or global identity is returned.
      security:
        - refreshBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicAccountVerifyRequest"
      responses:
        "200":
          $ref: "#/components/responses/PublicAccountRegistration"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/AccountUnavailable"
    options: *publicAccountPreflight
  /v1/public/account-sessions/refresh:
    post:
      operationId: refreshPublicAccountSession
      summary: Rotate an opaque account refresh capability
      description: >-
        Requires an explicit empty JSON object, no query parameters. Not an
        installation refresh JWT or account access JWT. Replay revokes the device
        session family; store the replacement capability atomically.
      security:
        - accountRefreshBearer: []
      requestBody:
        $ref: "#/components/requestBodies/EmptyPublicAccountObject"
      responses:
        "200":
          $ref: "#/components/responses/PublicAccountRegistration"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/AccountUnavailable"
    options: *publicAccountPreflight
  /v1/public/account-sessions/revoke:
    post:
      operationId: revokePublicAccountSession
      summary: Revoke the device session selected by an account JWT
      description: Requires an explicit empty JSON object, no query parameters. Does not erase local data.
      security:
        - accountBearer: []
      requestBody:
        $ref: "#/components/requestBodies/EmptyPublicAccountObject"
      responses:
        "200":
          description: Device session revoked
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [revoked]
                properties:
                  revoked:
                    const: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/AccountUnavailable"
    options: *publicAccountPreflight
  /v1/public/account-profile:
    put:
      operationId: updatePublicAccountProfile
      summary: Compare-and-swap declared account profile using an active account session
      description: >-
        Strict non-null JSON object, at most 4096 bytes; no query parameters.
        Version must match the stored profile or the response is 409 conflict.
        Omitted/empty country and region clear previous values; geography is declared, never inferred.
      security:
        - accountBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicAccountProfileRequest"
      responses:
        "200":
          description: Updated profile with its new CAS version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicAccountProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/AccountUnavailable"
    options: *publicAccountPreflight
  /v1/internal/product-directory/query:
    post:
      operationId: queryProductDirectory
      summary: Read minimal product contacts as a scoped private workload
      description: >-
        Requires workload role crm:product-directory:read and product authorization.
        No public CORS or public account credentials. Strict non-null JSON object,
        at most 65536 bytes; no query parameters. An opaque cursor is product-bound.
        A directory snapshot is not current permission to send mail.
      security:
        - internalBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductDirectoryQuery"
      responses:
        "200":
          description: Product-scoped contacts and permission evidence as of data_as_of
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDirectoryPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/DirectoryUnavailable"
  /v1/internal/product-directory/check:
    post:
      operationId: checkProductDirectory
      summary: Recheck up to 50 product-bound contact references as a private workload
      description: >-
        Requires workload role crm:product-directory:read and product authorization.
        No public CORS or public account credentials. Strict non-null JSON object,
        at most 65536 bytes; no query parameters. Unknown or inactive is not sending permission.
      security:
        - internalBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductDirectoryCheck"
      responses:
        "200":
          description: Current state and available permission evidence per reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDirectoryChecks"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/DirectoryUnavailable"
  /v1/email-identities:
    post:
      operationId: registerEmailIdentity
      summary: Consume a verified email challenge and create or resolve an identity
      description: >-
        Product scope is the default. Donation namespace is always product-local.
        Global minor linkage fails unless the deployment feature flag is enabled;
        unknown age can never request global linkage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailIdentityRequest"
      responses:
        "200":
          description: Existing identity resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailIdentityResponse"
        "201":
          description: Identity created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailIdentityResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/email-verifications:
    post:
      operationId: beginEmailVerification
      summary: Encrypt email and create a short-lived pending ownership challenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailVerificationRequest"
      responses:
        "202":
          description: Verification challenge created; no email is returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailVerificationResponse"
  /v1/internal/email-verifications/{id}/verify:
    post:
      operationId: verifyEmailOwnership
      summary: Record external ownership evidence as an email_verifier workload
      parameters:
        - $ref: "#/components/parameters/UUIDPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [product_id, evidence_id]
              properties:
                product_id:
                  $ref: "#/components/schemas/ProductID"
                evidence_id:
                  type: string
                  minLength: 1
                  maxLength: 200
      responses:
        "200":
          description: Ownership evidence recorded
  /v1/tokens:
    post:
      operationId: issueToken
      summary: Issue a short-lived product-scoped JWT with no email or root UUID
      description: Account JWTs contain the account subject key and a separate pairwise person_key for privacy aggregation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "201":
          description: Token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/organization-submissions:
    post:
      operationId: createOrganizationSubmission
      summary: Submit a free-text organization name for review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationSubmissionRequest"
      responses:
        "201":
          description: Submission created with pending status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/internal/organizations:
    post:
      operationId: createCanonicalOrganization
      summary: Create a canonical organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [canonical_name]
              properties:
                canonical_name:
                  type: string
                  minLength: 1
                  maxLength: 240
      responses:
        "201":
          description: Canonical organization created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedStatus"
  /v1/internal/organization-submissions/{id}/resolve:
    post:
      operationId: resolveOrganizationSubmission
      summary: Match or reject a pending organization submission
      parameters:
        - $ref: "#/components/parameters/UUIDPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationResolutionRequest"
      responses:
        "200":
          description: Submission resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/internal/organizations/{id}/merge:
    post:
      operationId: mergeCanonicalOrganization
      summary: Audit and merge a canonical organization into another
      parameters:
        - $ref: "#/components/parameters/UUIDPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationMergeRequest"
      responses:
        "200":
          description: Organization merged
          content:
            application/json:
              schema:
                type: object
                required: [id, status, merged_into_id]
                properties:
                  id:
                    $ref: "#/components/schemas/UUID"
                  status:
                    const: merged
                  merged_into_id:
                    $ref: "#/components/schemas/UUID"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/memberships:
    post:
      operationId: createMembership
      summary: Create or update a person's canonical organization membership
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MembershipRequest"
      responses:
        "201":
          description: Membership recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/consents:
    post:
      operationId: createConsent
      summary: Append an explicit versioned consent status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentRequest"
      responses:
        "201":
          description: Consent evidence recorded
          content:
            application/json:
              schema:
                type: object
                required: [id, recorded_at]
                properties:
                  id:
                    $ref: "#/components/schemas/UUID"
                  recorded_at:
                    type: string
                    format: date-time
  /v1/telemetry-preferences:
    put:
      operationId: setTelemetryPreference
      summary: Record explicit telemetry preference
      description: Client recorded_at is bounded and retained only as audit time. A transition to denied emits a suppression event with server time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelemetryPreferenceRequest"
      responses:
        "200":
          description: Preference stored
          content:
            application/json:
              schema:
                type: object
                required: [preference, recorded_at]
                properties:
                  preference:
                    type: string
                    enum: [allowed, denied]
                  recorded_at:
                    type: string
                    format: date-time
  /v1/privacy-requests:
    post:
      operationId: createPrivacyRequest
      summary: Request deletion
      description: Anonymous installations can request product scope only.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrivacyRequest"
      responses:
        "202":
          description: Request accepted for processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedStatus"
  /v1/internal/privacy-requests:
    post:
      operationId: createGlobalPrivacyRequest
      summary: Create an all-products request as a privacy_global workload
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrivacyRequest"
      responses:
        "202":
          description: Global request accepted for durable orchestration
  /v1/privacy-requests/{id}:
    get:
      operationId: getPrivacyRequest
      summary: Read privacy-request status
      parameters:
        - $ref: "#/components/parameters/UUIDPath"
      responses:
        "200":
          description: Current request status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivacyRequestStatus"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/internal/privacy-requests/{id}/status:
    post:
      operationId: updatePrivacyRequestStatus
      summary: Apply an audited privacy-request state transition
      parameters:
        - $ref: "#/components/parameters/UUIDPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrivacyStatusUpdate"
      responses:
        "200":
          description: State transition applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
components:
  requestBodies:
    EmptyPublicAccountObject:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
  securitySchemes:
    internalBearer:
      type: http
      scheme: bearer
      description: Per-workload credential. Server-side roles and product scopes authorize each route.
    refreshBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Audience-separated anonymous installation refresh capability.
    accountBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived account access JWT; not a Metrics token, refresh capability or local registration receipt.
    accountRefreshBearer:
      type: http
      scheme: bearer
      description: Opaque rotating device account refresh capability (32 bytes, canonical unpadded base64url), not a JWT.
  parameters:
    UUIDPath:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
  responses:
    BadRequest:
      description: Request failed strict validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Required workload, installation or account bearer credential is missing or invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Linkage policy forbids the operation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Existing resource conflicts with the supplied data
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: Required dependency is unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Status"
    TooManyRequests:
      description: Public request or durable registration budget exhausted; rate_limited
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AccountUnavailable:
      description: Account dependency unavailable; account_unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    DirectoryUnavailable:
      description: Directory dependency unavailable; directory_unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PublicAccountRegistration:
      description: >-
        Device session, account access JWT and local-only registration receipt;
        Cache-Control no-store. metrics_token is currently null. Not a telemetry consent.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PublicAccountRegistration"
  schemas:
    ClientNonce:
      type: string
      pattern: "^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$"
      description: Canonical unpadded base64url encoding of 32 random bytes; never an installation ID.
    HolderRole:
      type: string
      enum: [self, representative]
    PublicAccountChallengeRequest:
      type: object
      additionalProperties: false
      required: [request_id, product_id, email, purpose, client_nonce, holder_role]
      properties:
        request_id:
          allOf:
            - $ref: "#/components/schemas/UUID"
            - pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
        product_id:
          $ref: "#/components/schemas/ProductID"
        email:
          type: string
          format: email
          writeOnly: true
        purpose:
          const: product_registration
        client_nonce:
          $ref: "#/components/schemas/ClientNonce"
        holder_role:
          $ref: "#/components/schemas/HolderRole"
    PublicAccountChallenge:
      type: object
      additionalProperties: false
      required: [contract_version, challenge_id, status, expires_at, resend_after]
      properties:
        contract_version:
          const: 1
        challenge_id:
          $ref: "#/components/schemas/UUID"
        status:
          type: string
          enum: [queued, pending, verified, delivery_failed, expired, locked, cancelled]
          description: >-
            queued while requested/deferred; pending after SMTP claim or when
            delivered/delivery_uncertain; verified when consumed; other states are terminal.
        expires_at:
          type: string
          format: date-time
          description: Immutable 48-hour queue deadline when queued; actual code deadline (10 minutes from claim) when pending.
        resend_after:
          type: string
          format: date-time
          description: Resend anti-abuse floor, not a delivery estimate or a reason to create a new request while queued.
    PublicAccountVerifyRequest:
      type: object
      additionalProperties: false
      required: [product_id, code, client_nonce]
      properties:
        product_id:
          $ref: "#/components/schemas/ProductID"
        code:
          type: string
          pattern: "^[0-9]{6}$"
          writeOnly: true
        client_nonce:
          $ref: "#/components/schemas/ClientNonce"
    PublicAccountProfileRequest:
      type: object
      additionalProperties: false
      required: [version, holder_role]
      properties:
        version:
          type: integer
          minimum: 0
          maximum: 18446744073709551614
          description: Expected current profile version; stale versions return 409, success increments it.
        holder_role:
          $ref: "#/components/schemas/HolderRole"
        country:
          type: string
          description: Optional declared two-letter country code, trimmed and uppercased; empty clears it.
        region:
          type: string
          description: Optional declared country-prefixed region (e.g. RU-MOW), trimmed and uppercased; empty clears it. Must match country.
    PublicAccountProfile:
      type: object
      additionalProperties: false
      required: [product, account_key, version, holder_role, country, region, updated_at]
      properties:
        product:
          $ref: "#/components/schemas/ProductID"
        account_key:
          $ref: "#/components/schemas/OpaqueKey"
        version:
          type: integer
          minimum: 1
          maximum: 18446744073709551615
        holder_role:
          $ref: "#/components/schemas/HolderRole"
        country:
          type: string
          pattern: "^([A-Z]{2})?$"
        region:
          type: string
          pattern: "^([A-Z]{2}-[A-Z0-9]{1,3})?$"
        updated_at:
          type: string
          format: date-time
    PublicAccountRegistration:
      type: object
      additionalProperties: false
      required: [contract_version, product, account_key, installation_key, account_profile, account_token, refresh_token, refresh_expires_at, registration_receipt, metrics_token]
      properties:
        contract_version:
          const: 1
        product:
          $ref: "#/components/schemas/ProductID"
        account_key:
          $ref: "#/components/schemas/OpaqueKey"
        installation_key:
          $ref: "#/components/schemas/OpaqueKey"
        account_profile:
          $ref: "#/components/schemas/PublicAccountProfile"
        account_token:
          allOf:
            - $ref: "#/components/schemas/PublicAccessToken"
          description: Five-minute account access JWT; never a Metrics JWT or local receipt.
        refresh_token:
          allOf:
            - $ref: "#/components/schemas/ClientNonce"
          description: Separate rotating opaque device account refresh capability, not an installation refresh JWT.
        refresh_expires_at:
          type: string
          format: date-time
        registration_receipt:
          type: string
          description: Signed local registration evidence only; never an online bearer credential.
        metrics_token:
          description: Currently always null; registration neither requires nor grants telemetry consent.
          oneOf:
            - $ref: "#/components/schemas/PublicAccessToken"
            - type: "null"
    ProductDirectoryQuery:
      type: object
      additionalProperties: false
      properties:
        product_id:
          $ref: "#/components/schemas/ProductID"
          description: Omission selects the product only for a single-product workload.
        cursor:
          type: string
          description: Opaque product-bound cursor; empty starts a new scan.
        limit:
          type: integer
          minimum: 0
          maximum: 50
          default: 25
          description: Zero or omission uses 25; a filtered page may be short or empty even with next_cursor.
    ProductDirectoryCheck:
      type: object
      additionalProperties: false
      required: [references]
      properties:
        product_id:
          $ref: "#/components/schemas/ProductID"
          description: Omission selects the product only for a single-product workload.
        references:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items:
            type: string
    ProductDirectoryPermission:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [unknown, granted, withdrawn]
        evidence_id:
          $ref: "#/components/schemas/UUID"
        policy_version:
          type: string
        recorded_at:
          type: string
          format: date-time
          description: Go may serialize the zero timestamp for unknown permissions; it is not evidence.
    ProductDirectoryPermissions:
      type: object
      additionalProperties: false
      required: [news, research, service]
      properties:
        news:
          $ref: "#/components/schemas/ProductDirectoryPermission"
        research:
          $ref: "#/components/schemas/ProductDirectoryPermission"
        service:
          $ref: "#/components/schemas/ProductDirectoryPermission"
    ProductDirectoryEntry:
      type: object
      additionalProperties: false
      required: [account_key, contact_reference, email, origin, verified_at, holder_role, country, region, version, telemetry_preference, permissions]
      properties:
        account_key:
          $ref: "#/components/schemas/OpaqueKey"
          description: Product directory/telemetry audience alias; not the public account audience alias.
        contact_reference:
          type: string
          description: Opaque product-bound reference for check; not an authorization credential.
        email:
          type: string
          format: email
          description: Verified contact disclosed only to an authorized private workload.
        origin:
          const: identity_product_registration
        verified_at:
          type: string
          format: date-time
        holder_role:
          $ref: "#/components/schemas/HolderRole"
        country:
          type: string
        region:
          type: string
        version:
          type: integer
          minimum: 1
          maximum: 18446744073709551615
        telemetry_preference:
          type: string
          enum: [unknown, allowed, denied]
        permissions:
          $ref: "#/components/schemas/ProductDirectoryPermissions"
    ProductDirectoryPage:
      type: object
      additionalProperties: false
      required: [contract_version, product, entries, data_as_of]
      properties:
        contract_version:
          const: 1
        product:
          $ref: "#/components/schemas/ProductID"
        entries:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/ProductDirectoryEntry"
        next_cursor:
          type: string
        data_as_of:
          type: string
          format: date-time
    ProductDirectoryCheckResult:
      type: object
      additionalProperties: false
      required: [contact_reference, state]
      properties:
        contact_reference:
          type: string
        account_key:
          $ref: "#/components/schemas/OpaqueKey"
        state:
          type: string
          enum: [active, inactive, unknown]
        reason:
          type: string
          enum: [invalid_or_expired_reference, account_inactive_or_privacy_changed]
        version:
          type: integer
          minimum: 1
          maximum: 18446744073709551615
        permissions:
          $ref: "#/components/schemas/ProductDirectoryPermissions"
    ProductDirectoryChecks:
      type: object
      additionalProperties: false
      required: [contract_version, product, results, checked_at]
      properties:
        contract_version:
          const: 1
        product:
          $ref: "#/components/schemas/ProductID"
        results:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/ProductDirectoryCheckResult"
        checked_at:
          type: string
          format: date-time
    UUID:
      type: string
      format: uuid
    ProductID:
      type: string
      pattern: "^[a-z][a-z0-9_-]{1,63}$"
    OpaqueKey:
      type: string
      pattern: "^[a-f0-9]{64}$"
    Status:
      type: object
      required: [status]
      properties:
        status:
          type: string
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    CreatedStatus:
      type: object
      required: [id, status]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        status:
          type: string
    SubjectFields:
      type: object
      required: [subject_type, subject_key]
      properties:
        subject_type:
          type: string
          enum: [person, account, installation]
        subject_key:
          $ref: "#/components/schemas/OpaqueKey"
    InstallationRequest:
      type: object
      additionalProperties: false
      required: [platform]
      properties:
        product_id:
          $ref: "#/components/schemas/ProductID"
        platform:
          type: string
          minLength: 1
          maxLength: 64
    Installation:
      type: object
      required: [installation_key, product, platform, created_at]
      properties:
        installation_key:
          $ref: "#/components/schemas/OpaqueKey"
        product:
          $ref: "#/components/schemas/ProductID"
        platform:
          type: string
        created_at:
          type: string
          format: date-time
    PublicInstallationRequest:
      type: object
      additionalProperties: false
      required: [request_id, product_id, platform, preference, policy_version, recorded_at]
      properties:
        request_id:
          $ref: "#/components/schemas/UUID"
        product_id:
          $ref: "#/components/schemas/ProductID"
        platform:
          type: string
          enum: [windows, macos, linux, web, android, ios]
        preference:
          type: string
          enum: [unknown, allowed, denied]
        policy_version:
          type: string
          minLength: 1
          maxLength: 100
        recorded_at:
          type: string
          format: date-time
    PublicAccessToken:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_at]
      properties:
        access_token:
          type: string
        token_type:
          const: Bearer
        expires_at:
          type: string
          format: date-time
    PublicInstallationResponse:
      type: object
      additionalProperties: false
      required: [installation_key, product, platform, preference, policy_version, recorded_at, refresh_token, refresh_expires_at, metrics_token]
      properties:
        installation_key:
          $ref: "#/components/schemas/OpaqueKey"
        product:
          $ref: "#/components/schemas/ProductID"
        platform:
          type: string
        preference:
          type: string
          enum: [unknown, allowed, denied]
        policy_version:
          type: string
        recorded_at:
          type: string
          format: date-time
        refresh_token:
          type: string
        refresh_expires_at:
          type: string
          format: date-time
        metrics_token:
          oneOf:
            - $ref: "#/components/schemas/PublicAccessToken"
            - type: "null"
    PublicTokenResponse:
      type: object
      additionalProperties: false
      required: [installation_key, product, metrics_token]
      properties:
        installation_key:
          $ref: "#/components/schemas/OpaqueKey"
        product:
          $ref: "#/components/schemas/ProductID"
        metrics_token:
          $ref: "#/components/schemas/PublicAccessToken"
        access_token:
          type: string
          description: Looks-only compatibility field; identical to metrics_token.access_token for authenticated product linka-looks.
        token_type:
          const: Bearer
          description: Looks-only compatibility field; identical to metrics_token.token_type for authenticated product linka-looks.
        expires_at:
          type: string
          format: date-time
          description: Looks-only compatibility field; identical to metrics_token.expires_at for authenticated product linka-looks.
    PublicPreferenceRequest:
      type: object
      additionalProperties: false
      required: [preference, policy_version, recorded_at]
      properties:
        preference:
          const: denied
        policy_version:
          type: string
          minLength: 1
          maxLength: 100
        recorded_at:
          type: string
          format: date-time
    PublicPreferenceResponse:
      type: object
      additionalProperties: false
      required: [installation_key, product, preference, policy_version, recorded_at]
      properties:
        installation_key:
          $ref: "#/components/schemas/OpaqueKey"
        product:
          $ref: "#/components/schemas/ProductID"
        preference:
          const: denied
        policy_version:
          type: string
        recorded_at:
          type: string
          format: date-time
    EmailVerificationRequest:
      type: object
      additionalProperties: false
      required: [email, identity_namespace, age_category]
      properties:
        product_id:
          $ref: "#/components/schemas/ProductID"
        email:
          type: string
          format: email
          maxLength: 320
          writeOnly: true
        identity_namespace:
          type: string
          enum: [account, donation]
        age_category:
          type: string
          enum: [unknown, adult, minor]
        guardian_relationship:
          type: string
          minLength: 1
          maxLength: 120
          description: Optional free text for a minor; it is not proof of authority or consent.
        link_across_products:
          type: boolean
          default: false
        installation_key:
          $ref: "#/components/schemas/OpaqueKey"
    EmailVerificationResponse:
      type: object
      additionalProperties: false
      required: [verification_id, status, expires_at]
      properties:
        verification_id:
          $ref: "#/components/schemas/UUID"
        status:
          const: pending
        expires_at:
          type: string
          format: date-time
    EmailIdentityRequest:
      type: object
      additionalProperties: false
      required: [verification_id]
      properties:
        product_id:
          $ref: "#/components/schemas/ProductID"
        verification_id:
          $ref: "#/components/schemas/UUID"
        create_account:
          type: boolean
          default: false
    EmailIdentityResponse:
      type: object
      additionalProperties: false
      required: [subject_type, subject_key]
      properties:
        subject_type:
          type: string
          enum: [person, account]
        subject_key:
          $ref: "#/components/schemas/OpaqueKey"
    TokenRequest:
      type: object
      additionalProperties: false
      required: [subject_type, subject_key]
      properties:
        product_id:
          $ref: "#/components/schemas/ProductID"
        subject_type:
          type: string
          enum: [account, installation]
        subject_key:
          $ref: "#/components/schemas/OpaqueKey"
        ttl_seconds:
          type: integer
          minimum: 0
          description: Zero or omission uses configured short default; configured maximum always applies.
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_at]
      properties:
        access_token:
          type: string
        token_type:
          const: Bearer
        expires_at:
          type: string
          format: date-time
    OrganizationSubmissionRequest:
      allOf:
        - $ref: "#/components/schemas/SubjectFields"
        - type: object
          required: [product_id, submitted_name]
          properties:
            product_id:
              $ref: "#/components/schemas/ProductID"
            submitted_name:
              type: string
              minLength: 1
              maxLength: 240
      unevaluatedProperties: false
    OrganizationResolutionRequest:
      type: object
      additionalProperties: false
      required: [status, audit_note]
      properties:
        status:
          type: string
          enum: [matched, rejected]
        organization_id:
          $ref: "#/components/schemas/UUID"
        audit_note:
          type: string
          minLength: 1
          maxLength: 1000
    OrganizationMergeRequest:
      type: object
      additionalProperties: false
      required: [target_organization_id, reason]
      properties:
        target_organization_id:
          $ref: "#/components/schemas/UUID"
        reason:
          type: string
          minLength: 1
          maxLength: 1000
    MembershipRequest:
      type: object
      additionalProperties: false
      required: [person_key, organization_id, product_id, status]
      properties:
        person_key:
          $ref: "#/components/schemas/OpaqueKey"
        organization_id:
          $ref: "#/components/schemas/UUID"
        product_id:
          $ref: "#/components/schemas/ProductID"
        role_label:
          type: string
          minLength: 1
          maxLength: 120
        status:
          type: string
          enum: [active, inactive, pending]
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
    ConsentRequest:
      allOf:
        - $ref: "#/components/schemas/SubjectFields"
        - type: object
          required: [product_id, consent_type, policy_version, status, recorded_at]
          properties:
            product_id:
              $ref: "#/components/schemas/ProductID"
            consent_type:
              type: string
              minLength: 1
              maxLength: 100
            policy_version:
              type: string
              minLength: 1
              maxLength: 100
            status:
              type: string
              enum: [granted, withdrawn]
            recorded_at:
              type: string
              format: date-time
      unevaluatedProperties: false
    TelemetryPreferenceRequest:
      allOf:
        - $ref: "#/components/schemas/SubjectFields"
        - type: object
          required: [product_id, preference, recorded_at]
          properties:
            product_id:
              $ref: "#/components/schemas/ProductID"
            preference:
              type: string
              enum: [allowed, denied]
            recorded_at:
              type: string
              format: date-time
      unevaluatedProperties: false
    PrivacyRequest:
      allOf:
        - $ref: "#/components/schemas/SubjectFields"
        - type: object
          required: [request_type, scope]
          properties:
            request_type:
              type: string
              const: deletion
            scope:
              type: string
              enum: [product, all]
            product_id:
              $ref: "#/components/schemas/ProductID"
            anchor_product_id:
              $ref: "#/components/schemas/ProductID"
      unevaluatedProperties: false
    PrivacyRequestStatus:
      type: object
      required: [id, request_type, scope, status, requested_at]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        request_type:
          type: string
          enum: [export, deletion]
        scope:
          type: string
          enum: [product, all]
        product_id:
          $ref: "#/components/schemas/ProductID"
        status:
          type: string
          enum: [requested, processing, completed, rejected, cancelled]
        requested_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
    PrivacyStatusUpdate:
      type: object
      additionalProperties: false
      required: [status, audit_note]
      properties:
        status:
          type: string
          enum: [processing, rejected, cancelled]
        audit_note:
          type: string
          minLength: 1
          maxLength: 1000
