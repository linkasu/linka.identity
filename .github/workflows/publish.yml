name: Publish Identity Image

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: read
  packages: write

jobs:
  license-scope:
    name: Licensing publication guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.scope.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Test licensing guard
        run: python3 .github/scripts/licensing-deployment-guard.py --self-test
      - id: scope
        run: python3 .github/scripts/licensing-deployment-guard.py

  publish:
    needs: [license-scope]
    if: >-
      needs.license-scope.outputs.deploy == 'true' &&
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/linkasu/linka.identity:sha-${{ github.event.workflow_run.head_sha }}
