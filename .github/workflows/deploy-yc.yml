name: Deploy Identity YC

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact full lowercase commit SHA (40 hex characters)
        required: true
      image_tag:
        description: Immutable sha-<ref> image tag
        required: true
      mode:
        description: Deployment mode (schema migration is always operator-only)
        type: choice
        options: [normal, maintenance]
        default: normal
        required: true

permissions:
  contents: read
  packages: read
  actions: read

concurrency:
  group: identity-production
  cancel-in-progress: false

jobs:
  license-scope:
    name: Licensing publication guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.scope.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
          ref: main
      - name: Test licensing guard
        run: python3 .github/scripts/licensing-deployment-guard.py --self-test
      - id: scope
        run: python3 .github/scripts/licensing-deployment-guard.py

  deploy:
    needs: [license-scope]
    if: needs.license-scope.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment: production-yc
    defaults:
      run:
        shell: bash
    env:
      DEPLOY_REF: ${{ inputs.ref }}
      IMAGE_TAG: ${{ inputs.image_tag }}
      DEPLOY_MODE: ${{ inputs.mode }}
      IDENTITY_PUBLIC_URL: ${{ vars.IDENTITY_PUBLIC_URL }}
    steps:
      - name: Validate immutable inputs
        run: |
          [[ "$DEPLOY_REF" =~ ^[0-9a-f]{40}$ ]] || exit 1
          test "$IMAGE_TAG" = "sha-$DEPLOY_REF"
          case "$DEPLOY_MODE" in normal|maintenance) ;; *) exit 1 ;; esac
          test -n "$IDENTITY_PUBLIC_URL"
      - name: Require successful CI for exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run list --repo "$GH_REPO" --workflow ci.yml --commit "$DEPLOY_REF" \
            --status success --json headSha,conclusion,workflowName --limit 100 | \
            jq -e --arg ref "$DEPLOY_REF" 'any(.[]; .headSha == $ref and .conclusion == "success" and .workflowName == "ci")'
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}
          persist-credentials: false
      - name: Require reviewed schema version
        run: grep -qx 'const Version = uint64(3)' internal/schema/schema.go
      - name: Install YC CLI
        run: curl -fsSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -a
      - name: Configure service account
        env:
          YC_SA_KEY_JSON: ${{ secrets.YC_SA_KEY_JSON }}
          YC_CLOUD_ID: ${{ secrets.YC_CLOUD_ID }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
        run: |
          install -m 600 /dev/null /tmp/yc-key.json
          printf '%s' "$YC_SA_KEY_JSON" > /tmp/yc-key.json
          "$HOME/yandex-cloud/bin/yc" config set service-account-key /tmp/yc-key.json
          "$HOME/yandex-cloud/bin/yc" config set cloud-id "$YC_CLOUD_ID"
          "$HOME/yandex-cloud/bin/yc" config set folder-id "$YC_FOLDER_ID"
      - name: Mirror immutable image and resolve exact digest
        id: mirror
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_ACTOR: ${{ github.actor }}
          YC_SA_KEY_JSON: ${{ secrets.YC_SA_KEY_JSON }}
          YC_REGISTRY_ID: ${{ secrets.YC_REGISTRY_ID }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_ACTOR" --password-stdin
          printf '%s' "$YC_SA_KEY_JSON" | docker login cr.yandex --username json_key --password-stdin
          # YC rejects BuildKit attestation manifests; provenance stays in GHCR.
          source="ghcr.io/linkasu/linka.identity:$IMAGE_TAG"
          target="cr.yandex/$YC_REGISTRY_ID/linka-identity:$IMAGE_TAG"
          docker pull --platform linux/amd64 "$source"
          docker tag "$source" "$target"
          docker push --platform linux/amd64 "$target"
          digest="$(docker buildx imagetools inspect "$target" --format '{{json .Manifest.Digest}}' | jq -er '.')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'image_ref=cr.yandex/%s/linka-identity@%s\n' "$YC_REGISTRY_ID" "$digest" >> "$GITHUB_OUTPUT"
      - name: Check schema from exact image digest without migration
        if: inputs.mode == 'normal'
        env:
          IMAGE_REF: ${{ steps.mirror.outputs.image_ref }}
          YDB_ENDPOINT: ${{ vars.YDB_ENDPOINT }}
          YDB_DATABASE: ${{ vars.YDB_DATABASE }}
        run: |
          test -n "$YDB_ENDPOINT"
          test -n "$YDB_DATABASE"
          docker run --rm --user 0:0 --entrypoint /usr/local/bin/schema \
            --mount type=bind,source=/tmp/yc-key.json,target=/run/secrets/ydb-sa.json,readonly \
            -e YDB_ENDPOINT -e YDB_DATABASE \
            -e YDB_SERVICE_ACCOUNT_KEY_FILE_CREDENTIALS=/run/secrets/ydb-sa.json \
            "$IMAGE_REF" -check
      - name: Deploy immutable revision
        env:
          IMAGE_REF: ${{ steps.mirror.outputs.image_ref }}
          YC_RUNTIME_SA_ID: ${{ secrets.YC_RUNTIME_SA_ID }}
          YC_LOCKBOX_SECRET_ID: ${{ secrets.YC_LOCKBOX_SECRET_ID }}
          YC_LOCKBOX_SECRET_VERSION_ID: ${{ secrets.YC_LOCKBOX_SECRET_VERSION_ID }}
          YDB_ENDPOINT: ${{ vars.YDB_ENDPOINT }}
          YDB_DATABASE: ${{ vars.YDB_DATABASE }}
          EMAIL_KEY_ACTIVE_ID: ${{ vars.EMAIL_KEY_ACTIVE_ID }}
          BLIND_INDEX_CURRENT_VERSION: ${{ vars.BLIND_INDEX_CURRENT_VERSION }}
          TOKEN_ACTIVE_KEY_ID: ${{ vars.TOKEN_ACTIVE_KEY_ID }}
          TOKEN_ISSUER: ${{ vars.TOKEN_ISSUER }}
          PUBLIC_INSTALLATION_PRODUCTS: ${{ vars.PUBLIC_INSTALLATION_PRODUCTS }}
          PUBLIC_INSTALLATION_POLICY_VERSION: ${{ vars.PUBLIC_INSTALLATION_POLICY_VERSION }}
          PUBLIC_ADDITIONAL_POLICIES: ${{ vars.PUBLIC_INSTALLATION_ADDITIONAL_POLICIES }}
          METRIC_PRIVACY_URL: ${{ vars.METRIC_PRIVACY_URL }}
          PUBLIC_ACCOUNT_ENABLED: ${{ vars.PUBLIC_ACCOUNT_ENABLED || 'false' }}
          PUBLIC_ACCOUNT_PRODUCTS: ${{ vars.PUBLIC_ACCOUNT_PRODUCTS }}
          PUBLIC_ACCOUNT_POLICY_VERSION: ${{ vars.PUBLIC_ACCOUNT_POLICY_VERSION || 'product-registration-v1' }}
          PUBLIC_ACCOUNT_OTP_KEY_ID: ${{ vars.PUBLIC_ACCOUNT_OTP_KEY_ID || 'otp-v1' }}
          PUBLIC_ACCOUNT_SMTP_ADDR: ${{ vars.PUBLIC_ACCOUNT_SMTP_ADDR }}
          PUBLIC_ACCOUNT_SMTP_FROM: ${{ vars.PUBLIC_ACCOUNT_SMTP_FROM }}
          I1_LOCKBOX_SECRET_ID: ${{ vars.I1_LOCKBOX_SECRET_ID }}
          I1_LOCKBOX_VERSION_ID: ${{ vars.I1_LOCKBOX_VERSION_ID }}
        run: |
          test -n "$YC_RUNTIME_SA_ID"
          args=(serverless container revision deploy --container-name linka-identity
            --image "$IMAGE_REF" --cores 1 --memory 512M --execution-timeout 30s --concurrency 16
            --service-account-id "$YC_RUNTIME_SA_ID"
            --environment "HTTP_ADDR=:8080,DEPLOYMENT_ENVIRONMENT=production")
          if [[ "$DEPLOY_MODE" == maintenance ]]; then
            args+=(--environment "IDENTITY_MAINTENANCE_MODE=true")
          else
            for required in YDB_ENDPOINT YDB_DATABASE EMAIL_KEY_ACTIVE_ID PUBLIC_INSTALLATION_PRODUCTS \
              PUBLIC_INSTALLATION_POLICY_VERSION YC_LOCKBOX_SECRET_ID YC_LOCKBOX_SECRET_VERSION_ID; do
              test -n "${!required}"
            done
            case "$PUBLIC_ACCOUNT_ENABLED" in true|false) ;; *) exit 1 ;; esac
            args+=(--environment "IDENTITY_MAINTENANCE_MODE=false,YDB_ENDPOINT=$YDB_ENDPOINT,YDB_DATABASE=$YDB_DATABASE,YDB_METADATA_CREDENTIALS=1,EMAIL_KEY_PROVIDER=yandex-kms,EMAIL_KEY_ACTIVE_ID=$EMAIL_KEY_ACTIVE_ID,BLIND_INDEX_CURRENT_VERSION=$BLIND_INDEX_CURRENT_VERSION,TOKEN_ACTIVE_KEY_ID=$TOKEN_ACTIVE_KEY_ID,TOKEN_ISSUER=$TOKEN_ISSUER,PUBLIC_INSTALLATION_PRODUCTS=$PUBLIC_INSTALLATION_PRODUCTS,PUBLIC_INSTALLATION_POLICY_VERSION=$PUBLIC_INSTALLATION_POLICY_VERSION,PUBLIC_INSTALLATION_REFRESH_TTL=4320h,REQUIRE_OUTBOX_DELIVERY=true,OUTBOX_DELIVERY_URL=$METRIC_PRIVACY_URL"
              --environment "PUBLIC_INSTALLATION_ADDITIONAL_POLICIES=$PUBLIC_ADDITIONAL_POLICIES"
              --environment "PUBLIC_ACCOUNT_ENABLED=$PUBLIC_ACCOUNT_ENABLED,PUBLIC_ACCOUNT_POLICY_VERSION=$PUBLIC_ACCOUNT_POLICY_VERSION,PUBLIC_ACCOUNT_DAILY_LIMIT=200,PUBLIC_ACCOUNT_OTP_KEY_ID=$PUBLIC_ACCOUNT_OTP_KEY_ID"
              --environment "PUBLIC_ACCOUNT_PRODUCTS=$PUBLIC_ACCOUNT_PRODUCTS")
            for mapping in WORKLOADS_JSON:workloads_json PRODUCTS_JSON:products_json \
              PAIRWISE_ID_KEY_BASE64:pairwise_id_key_base64 EMAIL_YC_KMS_KEYS_JSON:email_yc_kms_keys_json \
              BLIND_INDEX_KEYS_JSON:blind_index_keys_json TOKEN_SIGNING_KEYS_JSON:token_signing_keys_json; do
              args+=(--secret "environment-variable=${mapping%%:*},id=$YC_LOCKBOX_SECRET_ID,version-id=$YC_LOCKBOX_SECRET_VERSION_ID,key=${mapping#*:}")
            done
            if [[ "$PUBLIC_ACCOUNT_ENABLED" == true ]]; then
              for required in I1_LOCKBOX_SECRET_ID I1_LOCKBOX_VERSION_ID PUBLIC_ACCOUNT_SMTP_ADDR PUBLIC_ACCOUNT_SMTP_FROM; do
                test -n "${!required}"
              done
              args+=(--environment "PUBLIC_ACCOUNT_SMTP_ADDR=$PUBLIC_ACCOUNT_SMTP_ADDR"
                --environment "PUBLIC_ACCOUNT_SMTP_FROM=$PUBLIC_ACCOUNT_SMTP_FROM")
              for mapping in PUBLIC_ACCOUNT_OTP_KEY_BASE64:public_account_otp_key_base64 \
                PUBLIC_ACCOUNT_SMTP_USER:public_account_smtp_user PUBLIC_ACCOUNT_SMTP_PASSWORD:public_account_smtp_password; do
                args+=(--secret "environment-variable=${mapping%%:*},id=$I1_LOCKBOX_SECRET_ID,version-id=$I1_LOCKBOX_VERSION_ID,key=${mapping#*:}")
              done
            fi
          fi
          "$HOME/yandex-cloud/bin/yc" "${args[@]}"
      - name: Verify maintenance health and unavailable readiness
        if: inputs.mode == 'maintenance'
        run: |
          deadline=$((SECONDS + 180))
          while (( SECONDS < deadline )); do
            if health_status="$(curl --silent --show-error --max-time 10 --output /tmp/identity-health.json \
              --write-out '%{http_code}' "$IDENTITY_PUBLIC_URL/healthz")" && \
              [[ "$health_status" == 200 ]] && \
              jq -e '.status == "ok" and .mode == "maintenance"' /tmp/identity-health.json >/dev/null && \
              [[ "$(curl --silent --show-error --max-time 10 --output /dev/null --write-out '%{http_code}' "$IDENTITY_PUBLIC_URL/readyz")" == 503 ]]; then
              exit 0
            fi
            sleep 5
          done
          echo '::error::Maintenance health criteria not met; existing invocations may still be draining'
          exit 1
      - name: Apply and verify gateway rate limit
        if: inputs.mode == 'normal'
        env:
          IDENTITY_GATEWAY_ID: ${{ vars.IDENTITY_GATEWAY_ID }}
        run: |
          test -n "$IDENTITY_GATEWAY_ID"
          "$HOME/yandex-cloud/bin/yc" serverless api-gateway update \
            --id "$IDENTITY_GATEWAY_ID" --spec infra/yandex/api-gateway.yaml
          spec="$("$HOME/yandex-cloud/bin/yc" serverless api-gateway get-spec \
            --id "$IDENTITY_GATEWAY_ID" --format json | jq -er .openapi_spec)"
          case "$spec" in
            *rateLimit:*"rps: 20"*) ;;
            *) echo '::error::Identity API Gateway must enforce a global 20 rps limit'; exit 1 ;;
          esac
      - name: Drain required workers through direct IAM invocation
        if: inputs.mode == 'normal'
        run: |
          container_url="$("$HOME/yandex-cloud/bin/yc" serverless container get \
            --name linka-identity --format json | jq -er .url)"
          container_url="${container_url%/}"
          iam_token="$("$HOME/yandex-cloud/bin/yc" iam create-token)"
          deadline=$((SECONDS + 180))
          while (( SECONDS < deadline )); do
            if tick_response="$(curl --fail --silent --show-error --max-time 15 \
              --request POST "$container_url/internal/workers/tick" \
              --header "Authorization: Bearer $iam_token")"; then
              if printf '%s' "$tick_response" | jq -e '.status == "ok"' >/dev/null && \
                curl --fail --silent --show-error --max-time 10 "$IDENTITY_PUBLIC_URL/readyz" | jq -e '.status == "ready"' >/dev/null; then
                exit 0
              fi
            fi
            sleep 5
          done
          echo '::error::Identity workers did not restore readiness'
          exit 1
      - name: Production readiness and JWKS smoke
        if: inputs.mode == 'normal'
        run: |
          curl --fail --silent --show-error --max-time 15 "$IDENTITY_PUBLIC_URL/healthz" | jq -e '.status == "ok"'
          curl --fail --silent --show-error --max-time 15 "$IDENTITY_PUBLIC_URL/readyz" | jq -e '.status == "ready"'
          curl --fail --silent --show-error --max-time 15 "$IDENTITY_PUBLIC_URL/.well-known/jwks.json" | jq -e '.keys | length >= 1'
          test "$(curl --silent --show-error --max-time 15 --output /dev/null --write-out '%{http_code}' \
            "$IDENTITY_PUBLIC_URL/internal/workers/tick")" = 404
      - name: Operator action required on failure
        if: failure()
        run: |
          echo '::error::No automatic rollback or schema mutation. Keep the current revision or explicitly deploy the reviewed maintenance candidate; never restore schema-1/2 code after schema-3 migration. Operator investigation is required.'
      - name: Remove deploy service-account key
        if: always()
        run: rm -f /tmp/yc-key.json
